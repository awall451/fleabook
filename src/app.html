<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Set the theme before first paint so the page never flashes the default
		     one. Keep the id list in sync with $lib/theme.ts. -->
		<script>
			(() => {
				try {
					const t = localStorage.getItem('fleabook:theme');
					document.documentElement.dataset.theme = [
						'facebook',
						'midnight',
						'paper',
						'win98',
					].includes(t)
						? t
						: 'facebook';
				} catch {
					document.documentElement.dataset.theme = 'facebook';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
